version: '3.8'

services:
  # Base de Datos (Django Backend)
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
    command: python manage.py runserver 0.0.0.0:8000

  # Aplicación Web (Vue Frontend)
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  # Microservicio de IA (FastAPI OCR)
  ocr_service:
    build:
      context: ./servicios/ocr_cashcalls
    ports:
      - "8001:8001"
    volumes:
      - ./servicios/ocr_cashcalls:/app
    # command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    # Nota: El servicio OCR puede tardar en compilar por las dependencias de IA.
